name: 自動擴充歷史年份片單 (Fetch Historical Years 2008-2024)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "起始年份（例如 2020，可填 2008～2024）"
        required: true
        default: "2022"
      end_year:
        description: "結束年份（例如 2024，建議每次跑 3～5 年避免逾時）"
        required: true
        default: "2024"
      overwrite:
        description: "是否覆蓋已存在的年份檔"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-years:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenCC for Traditional Chinese conversion
        run: pip install opencc-python-reimplemented

      - name: Fetch anime catalog for selected years
        run: |
          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi
          python3 scripts/fetch_year_data.py --start-year "${{ inputs.start_year }}" --end-year "${{ inputs.end_year }}" $OVERWRITE_FLAG

      - name: Commit new year datasets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-*.json years-manifest.json
          if git diff --cached --quiet; then
            echo "No new year data to commit."
          else
            git commit -m "feat: add anime catalog ${{ inputs.start_year }}-${{ inputs.end_year }}"
            git push
          fi
