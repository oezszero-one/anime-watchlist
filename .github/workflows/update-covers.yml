name: 自動補齊動漫封面網址 (Fetch Covers)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch cover URLs into data JSON files
        run: python3 scripts/fetch_covers.py

      - name: Commit updated cover URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-2025.json data-2026.json
          if git diff --cached --quiet; then
            echo "No new cover URLs to commit."
          else
            git commit -m "chore: pre-fill anime cover URLs"
            git push
          fi
